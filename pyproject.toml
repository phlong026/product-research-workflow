[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "product-research-workflow"
version = "0.1.0"
description = "Research workflow foundation for Amazon product research; human makes final Yes/No decision."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
workflow = [
  "langgraph>=1,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]
data = [
  "polars>=1,<2",
  "fastexcel>=0.13,<1",
]
xlsx = [
  "openpyxl>=3.1,<4",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_workflow"]
