name: Offline release checks
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.23
      - run: uv sync --frozen --all-extras --python 3.12
      - run: uv run --frozen --all-extras python -m pytest -q -ra
      - run: uv run --frozen --all-extras python -m compileall -q src scripts
      - run: uv run --frozen --all-extras python scripts/run_offline_demo.py --output runtime/ci-demo
